ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Railway terminates TLS at its edge and sends X-Forwarded-Proto; osTicket reads it itself.
# The config, include and setup files are never served.
<Directory /var/www/html/include>
    Require all denied
</Directory>
<FilesMatch "^(manage\.php|web\.config)$">
    Require all denied
</FilesMatch>

# Keep the access log quiet for Railway's health checks.
SetEnvIf Request_URI "^/healthz\.php$" dontlog
CustomLog /dev/stdout combined env=!dontlog
