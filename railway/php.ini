expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 34M
max_execution_time = 120
date.timezone = UTC
session.cookie_httponly = 1
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
